name: SUperRyzeNS [LEGACY]
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: 🕚Prepare timezone 
      run: |
            echo "BUILD_TIME=$(TZ=Asia/Jakarta date "+%d%m%Y-%H%M")" >> $GITHUB_ENV
            sudo rm /etc/localtime
            sudo ln -s /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
        
    - name: ♻️ Install Dependencies
      run: |
            sudo apt update -y
            sudo apt install -y zstd bc cpio flex bison aptitude git python-is-python3 tar perl wget curl lz4 lld llvm
            sudo aptitude install -y libssl-dev
        
    - name: ♻️ Cloning Toolchains 
      run: |
            set -e
            mkdir -p clang
            cd clang
            curl -L --fail --retry 3 \
            -o clang.tar.zst \
            https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
            tar --use-compress-program=unzstd -xvf clang.tar.zst
            cd ..
            git clone https://github.com/greenforce-project/gcc-arm64 -b main --depth=1 gcc64
            git clone https://github.com/greenforce-project/gcc-arm -b main --depth=1 gcc32
            echo "CLANG_PATH=$(pwd)/clang" >> $GITHUB_ENV
            echo "PATH=$(pwd)/clang/bin:$PATH" >> $GITHUB_ENV
            echo "GCC64_PATH=$(pwd)/gcc64" >> $GITHUB_ENV
            echo "GCC32_PATH=$(pwd)/gcc32" >> $GITHUB_ENV

    - name: 🖥️ MIUI Dimension
      run: |
            sed -i 's/qcom,mdss-pan-physical-width-dimension = <69>;$/qcom,mdss-pan-physical-width-dimension = <695>;/' arch/arm64/boot/dts/qcom/dsi-panel-k6-38-0c-0a-fhd-dsc-video.dtsi
            sed -i 's/qcom,mdss-pan-physical-height-dimension = <154>;$/qcom,mdss-pan-physical-height-dimension = <1546>;/' arch/arm64/boot/dts/qcom/dsi-panel-k6-38-0c-0a-fhd-dsc-video.dtsi
            
    - name: 📥 Fetch External Wireless Firmwares
      run: |
            mkdir -p firmware
            curl -f -sSL -o firmware/htc_9271.fw "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/htc_9271.fw"
            curl -f -sSL -o firmware/rtl8188eufw.bin "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtlwifi/rtl8188eufw.bin"
            cp firmware/htc_9271.fw firmware/htc_9271-1.4.0.fw
            
            # Duplicate to the output directory (out/) for O=out needs
            mkdir -p out/firmware
            cp -r firmware/* out/firmware/
            
            echo "=== FIRMWARE FOLDER CONTENTS ==="
            ls -lh firmware/

    - name: ♻️ Build 🦊SUperRyzeNS
      run: |
           export ARCH=arm64
           export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"
           export KBUILD_BUILD_USER=slipz
           export KBUILD_BUILD_HOST=SIX
           export KBUILD_COMPILER_STRING="$CLANG_PATH/clang"
           
           make O=out vendor/sweet_defconfig
           
           # 1. Inject external Wi-Fi firmware
           scripts/config --file out/.config --set-str CONFIG_EXTRA_FIRMWARE "htc_9271.fw htc_9271-1.4.0.fw rtl8188eufw.bin"
           scripts/config --file out/.config --set-str CONFIG_EXTRA_FIRMWARE_DIR "$GITHUB_WORKSPACE/firmware"
           
           # 2. Fix KernelSU-Next module support
           scripts/config --file out/.config --enable CONFIG_KSU
           scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
           scripts/config --file out/.config --enable CONFIG_TMPFS_XATTR
           scripts/config --file out/.config --enable CONFIG_TMPFS_POSIX_ACL
           
           # Verify that the config was applied successfully.
           echo "=== VERIFY FIRMWARE CONFIG & KSU ==="
           grep "CONFIG_EXTRA_FIRMWARE" out/.config
           grep -E "CONFIG_KSU|CONFIG_OVERLAY_FS" out/.config
           
           make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
             CC=clang \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             CROSS_COMPILE=$GCC64_PATH/bin/aarch64-elf- \
             CROSS_COMPILE_ARM32=$GCC32_PATH/bin/arm-eabi-
             
           mv out/.config out/sweet_defconfig.txt

    - name: 📊 Check Driver & Kernel Size
      run: |
           export PATH="$CLANG_PATH/bin:$PATH"
           echo "=========================================="
           echo "          SIZE OF DRIVER WIRELESS           "
           echo "=========================================="
           find out/drivers/net/wireless/ -name "*.o" -exec llvm-size {} + 2>/dev/null || true

           echo "=========================================="
           echo "        ALL SIZE OF DRIVER WIRELESS        "
           echo "=========================================="
           du -sh out/drivers/net/wireless/

           echo "=========================================="
           echo "          SIZE KERNEL IMAGE BUILD          "
           echo "=========================================="
           ls -lh out/arch/arm64/boot/Image*
           
    - name: 📩 Upload defconfig 
      uses: actions/upload-artifact@v4
      with:
        name: defconfig-${{ env.BUILD_TIME }}
        path: out/sweet_defconfig.txt

    - name: ♻️ Fetch AnyKernel3
      run: |
           git clone --depth=1 https://github.com/slipzryzens/anykernel3 -b main AnyKernel3  
           cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
           cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
           cp out/arch/arm64/boot/dtb.img AnyKernel3/dtb.img
           cd AnyKernel3
           zip -r "../SR-Net.Reaper-LEGACY-${{ env.BUILD_TIME }}.zip" *

    - name: 📩 Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: SR-Net.Reaper-LEGACY-${{ env.BUILD_TIME }}
        path: AnyKernel3/*

    - name: 💌 Sending to zeNS Telegram Bot
      if: success()
      run: |
        cd AnyKernel3

        ZIP_NAME=SR-Net.Reaper-LEGACY-${{ env.BUILD_TIME }}.zip
        zip -r9 "$ZIP_NAME" ./*

        CAPTION="✅ <b>Kernel Build Success</b>
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━
        Device          : Redmi Note 10 Pro
        Kernel           : SUperRyzeNS [LEGACY]
        Toolchain      : Neutron / Google Clang
        Sender          : zeNS Bot
        Build Time    : ${{ env.BUILD_TIME }}
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        curl -f \
          -F document=@"$ZIP_NAME" \
          -F chat_id=${{ secrets.TG_CHAT_ID }} \
          -F parse_mode=HTML \
          -F caption="$CAPTION" \
          https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendDocument
